server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Správný typ pro manifest (přidání appky na plochu mobilu)
    location = /manifest.json {
        types { }
        default_type application/manifest+json;
    }

    # Hlavní stránka se vždy ověří u serveru (jinak prohlížeč ukazuje starou verzi appky).
    # Styly a skripty mají v odkazu ?v=verze, takže nová verze = nový soubor.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
