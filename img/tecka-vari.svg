<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Tečka – vaří</title><defs><pattern id="raster" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.7" fill="#c69a4c" opacity=".65"/></pattern>
<clipPath id="tc"><circle cx="100" cy="112" r="64"/></clipPath></defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.hop{animation:hop 3.2s ease-in-out infinite;transform-origin:100px 186px}
.lis{animation:lis 2.8s ease-in-out infinite}
.oko{animation:mrk 5s infinite}
.bub{animation:bub 2.6s ease-in-out infinite}
.bub2{animation-delay:.7s}
.kon{animation:kon 1.6s ease-in-out infinite}
.kon2{animation-delay:.8s}
.lzice{animation:lzice 1.8s ease-in-out infinite;transform-origin:170px 168px}
}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-5px) scale(.99,1.01)}55%{transform:translateY(-5px)}}
@keyframes lis{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes mrk{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}96%{transform:scaleY(1)}}
@keyframes bub{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-7px);opacity:.55}}
@keyframes kon{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.3;transform:translateY(3px)}}
@keyframes lzice{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
</style><ellipse cx="100" cy="190" rx="44" ry="6" fill="#1f1d1a" opacity=".15"/><g class="hop"><path d="M38 120c-18-4-26 10-18 22" fill="none" stroke="#1f1d1a" stroke-width="6.0" stroke-linecap="round"/>
<path d="M162 110c16-16 28-8 28 4" fill="none" stroke="#1f1d1a" stroke-width="6.0" stroke-linecap="round"/>
<circle cx="100" cy="112" r="64" fill="#f4e2b6"/>
<g clip-path="url(#tc)"><circle cx="100" cy="112" r="64" fill="url(#raster)"/><circle cx="88" cy="99" r="60" fill="#f4e2b6"/></g>
<circle cx="100" cy="112" r="64" fill="none" stroke="#1f1d1a" stroke-width="5.1"/>
<path d="M66 64c-14-4-14-26 4-26 2-14 22-18 30-6 8-12 28-8 30 6 18 0 18 22 4 26z" fill="#fff" stroke="#1f1d1a" stroke-width="5.1" stroke-linejoin="round"/>
<path d="M68 64h64v10H68z" fill="#fff" stroke="#1f1d1a" stroke-width="5.1" stroke-linejoin="round"/>
<path d="M118 34c8-10 20-10 26-6-5 10-18 11-26 6z" fill="#5e7769" stroke="#1f1d1a" stroke-width="3.4" stroke-linejoin="round"/>
<g class="oko" style="transform-origin:100px 108px"><ellipse cx="80" cy="108" rx="9" ry="11" fill="#fff" stroke="#1f1d1a" stroke-width="3.1"/><circle cx="82" cy="110" r="5" fill="#1f1d1a"/><circle cx="84" cy="107" r="1.8" fill="#fff"/><ellipse cx="120" cy="108" rx="9" ry="11" fill="#fff" stroke="#1f1d1a" stroke-width="3.1"/><circle cx="122" cy="110" r="5" fill="#1f1d1a"/><circle cx="124" cy="107" r="1.8" fill="#fff"/></g><path d="M89 132c6 7 16 7 22 0" fill="none" stroke="#1f1d1a" stroke-width="4.4" stroke-linecap="round"/><circle cx="68" cy="126" r="7" fill="#e9a6a0" opacity=".8"/><circle cx="132" cy="126" r="7" fill="#e9a6a0" opacity=".8"/>
<g class="lzice"><path d="M160 168l22-62" stroke="#c4935a" stroke-width="8.5" stroke-linecap="round"/><ellipse cx="183" cy="100" rx="7" ry="11" fill="#d9a86c" stroke="#1f1d1a" stroke-width="3.4" transform="rotate(20 183 100)"/></g></g></svg>
